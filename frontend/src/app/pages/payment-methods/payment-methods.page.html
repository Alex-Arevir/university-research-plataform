<!-- Muestra la pantalla de métodos de pago. -->

<!-- Encabezado -->

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Métodos de pago</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Contenido -->
<ion-content class="ion-padding">
  <ion-text color="medium">
    <p>{{ message }}</p>
  </ion-text>
  <!-- Lista de registros -->
  <ion-list>
    <ion-item *ngFor="let m of methods">
      <ion-label>
        <h2>{{ m.name }}</h2>
        <p>{{ m.status }}</p>
      </ion-label>
      <ion-button
        fill="clear"
        (click)="toggle(m)"
      >
        {{ m.status === "active" ? "Desactivar" : "Activar" }}
      </ion-button>
    </ion-item>
  </ion-list>
  <!-- Botón para agregar -->
  <ion-fab
    class="add-fab"
    slot="fixed"
    vertical="bottom"
    horizontal="end"
  >
    <ion-fab-button (click)="modalOpen = true">
      <span class="add-symbol">+</span>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<!-- Ventana de formulario o detalle -->
<ion-modal
  [isOpen]="modalOpen"
  (didDismiss)="modalOpen = false"
>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Nuevo método</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="modalOpen = false">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-card>
        <ion-card-content>
          <ion-input
            label="Nombre"
            labelPlacement="stacked"
            [(ngModel)]="name"
          ></ion-input>
          <ion-button
            expand="block"
            (click)="create()"
            [disabled]="saving || !name.trim()"
          >
            Agregar
          </ion-button>
        </ion-card-content>
      </ion-card>
    </ion-content>
  </ng-template>
</ion-modal>
