<!-- Muestra la pantalla de cambio de contraseña. -->

<!-- Encabezado -->

<ion-header>
  <ion-toolbar>
    <ion-title>La Obra</ion-title>
  </ion-toolbar>
</ion-header>

<!-- Contenido -->
<ion-content class="ion-padding">
  <h1>Cambiar contraseña</h1>

  <p>Por seguridad, debes cambiar tu contraseña antes de continuar.</p>

  <ion-item>
    <ion-label position="stacked">Contraseña actual</ion-label>
    <ion-input
      type="password"
      [(ngModel)]="currentPassword"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Nueva contraseña</ion-label>
    <ion-input
      type="password"
      [(ngModel)]="newPassword"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Confirmar nueva contraseña</ion-label>
    <ion-input
      type="password"
      [(ngModel)]="confirmPassword"
    ></ion-input>
  </ion-item>

  <p *ngIf="errorMessage">
    {{ errorMessage }}
  </p>

  <ion-button
    expand="block"
    (click)="changePassword()"
    [disabled]="loading"
  >
    {{ loading ? "CAMBIANDO..." : "CAMBIAR CONTRASEÑA" }}
  </ion-button>
</ion-content>
